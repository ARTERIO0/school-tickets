<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая заявка</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f6fb; --surface: #ffffff; --text: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --primary: #6366f1; --primary-hover: #4f46e5;
            --success: #10b981;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        }
        [data-theme="dark"] {
            --bg: #0a0f1e; --surface: #151b2e; --text: #f1f5f9; --text-muted: #94a3b8;
            --border: #2a3350; --primary: #818cf8; --primary-hover: #a5b4fc;
            --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px;
            display: flex; justify-content: center; align-items: flex-start;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(99,102,241,0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(236,72,153,0.06), transparent 40%);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .container { width: 100%; max-width: 500px; margin-top: 40px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
        .icon-btn {
            width: 40px; height: 40px; display: inline-flex;
            align-items: center; justify-content: center;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; cursor: pointer; font-size: 18px;
            transition: all 0.2s ease; color: var(--text);
        }
        .icon-btn:hover { transform: translateY(-1px); }
        form {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 28px; box-shadow: var(--shadow);
        }
        .current-user {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-radius: 10px;
            background: rgba(99,102,241,0.08);
            border: 1px solid rgba(99,102,241,0.2);
            margin-bottom: 20px; font-size: 14px;
        }
        .current-user-icon { font-size: 20px; }
        .current-user strong { color: var(--primary); }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
        input, textarea, select {
            width: 100%; padding: 11px 14px;
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg); color: var(--text);
            font-family: inherit; font-size: 14px;
            margin-bottom: 16px; transition: border-color 0.2s ease;
        }
        input:focus, textarea:focus, select:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        textarea { resize: vertical; min-height: 100px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 13px 20px; background: var(--gradient); color: #fff;
            border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; width: 100%;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(99,102,241,0.35);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(99,102,241,0.5); }
        .back-link {
            display: block; text-align: center; margin-top: 16px;
            color: var(--text-muted); text-decoration: none; font-size: 14px;
        }
        .back-link:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>📝 Новая заявка</h1>
            <button class="icon-btn" id="theme-toggle" title="Переключить тему">🌙</button>
        </div>
        <form method="POST">
            <div class="current-user">
                <span class="current-user-icon">👤</span>
                <span>Заявку создаёт: <strong>{{ author_name }}</strong></span>
            </div>

            <label>Кабинет</label>
            <input type="text" name="room" required placeholder="Например, 204" autofocus>

            <label>Что сломалось?</label>
            <select name="category">
                <option value="🖨️ Принтер">🖨️ Принтер</option>
                <option value="💻 Компьютер">💻 Компьютер</option>
                <option value="🌐 Интернет">🌐 Интернет</option>
                <option value="📽️ Проектор">📽️ Проектор</option>
                <option value="📝 Другое">📝 Другое</option>
            </select>

            <label>Опишите проблему</label>
            <textarea name="issue" required placeholder="Например: не печатает, зажевало бумагу..."></textarea>

            <label>Насколько срочно?</label>
            <select name="priority">
                <option value="Обычная">Обычная</option>
                <option value="Срочная">🔥 Срочная (нужно на уроке)</option>
            </select>

            <button type="submit">Отправить заявку</button>
            <a href="/" class="back-link">← Назад к списку</a>
        </form>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        themeToggle.addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
