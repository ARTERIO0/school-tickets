<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход для техника</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 20px; display: flex; justify-content: center; align-items: center; height: 80vh; }
        form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #2980b9; }
        .error { color: #e74c3c; font-size: 14px; margin-bottom: 10px; }
        a { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>🔒 Вход для администрации</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <input type="password" name="password" placeholder="Введите пароль" required autofocus>
        <button type="submit">Войти</button>
        <a href="/">← Назад к заявкам</a>
    </form>
</body>
</html>
